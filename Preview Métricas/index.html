<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NG2117 - HUD Mobile</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; background-color: #020203; color: #E8E4F0; display: flex; justify-content: center; overflow: hidden; }
        
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-mono { font-family: 'Courier Prime', monospace; }
        
        /* Scanlines Effect para o toque "Tecnológico" */
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Animação suave para o card */
        .card-enter { animation: slideIn 0.5s ease-out forwards; }
        @keyframes slideIn {
            from { transform: translateY(20px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="root" class="w-full h-screen sm:max-w-md bg-[#050508] relative shadow-2xl scanlines"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Componente do Ícone no Topo (Compacto)
        const TopMetric = ({ value, icon, color, label }) => {
            // Calcula opacidade baseada no valor (baixo valor = ícone mais apagado)
            const opacity = Math.max(0.3, value / 100);
            
            return (
                <div className="flex flex-col items-center justify-center w-16 relative">
                    {/* Efeito de aquarela no fundo do ícone */}
                    <div className="absolute inset-0 z-0 transition-opacity duration-300"
                         style={{ 
                             background: `radial-gradient(circle, ${color}30 0%, transparent 70%)`,
                             filter: 'url(#watercolor-bleed)',
                             opacity: value > 70 ? 0.8 : 0.2
                         }}>
                    </div>

                    {/* Ícone com filtro de Nanquim */}
                    <div className="relative z-10 w-8 h-8 mb-1 flex items-center justify-center transition-all duration-300"
                         style={{ filter: 'url(#rough-ink)', opacity: opacity }}>
                        <svg viewBox="0 0 24 24" className="w-full h-full drop-shadow-md" stroke={color} strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round">
                            {icon}
                        </svg>
                    </div>

                    {/* Barra de Progresso Compacta */}
                    <div className="w-10 h-1.5 bg-[#1A1A1E] rounded-full overflow-hidden relative" style={{ filter: 'url(#rough-ink)' }}>
                        <div className="absolute top-0 left-0 h-full transition-all duration-700 ease-out"
                             style={{ width: `${value}%`, backgroundColor: color }}>
                        </div>
                    </div>
                    
                    {/* Valor Numérico (Opcional, mas comum em HUDs tech) */}
                    <span className="font-mono text-[9px] mt-1 opacity-70 tracking-widest" style={{ color: color }}>
                        {value}%
                    </span>
                </div>
            );
        };

        const App = () => {
            const [metrics, setMetrics] = useState({
                sintonia: 50, tensao: 20, creditos: 60, estrutura: 80
            });
            const [turn, setTurn] = useState(1);

            const simulateSwipe = () => {
                setMetrics({
                    sintonia: Math.max(0, Math.min(100, metrics.sintonia + (Math.random() * 30 - 15))),
                    tensao: Math.max(0, Math.min(100, metrics.tensao + (Math.random() * 30 - 10))), // Tensão tende a subir
                    creditos: Math.max(0, Math.min(100, metrics.creditos + (Math.random() * 40 - 20))),
                    estrutura: Math.max(0, Math.min(100, metrics.estrutura + (Math.random() * 20 - 15))) // Estrutura tende a cair
                });
                setTurn(t => t + 1);
            };

            return (
                <div className="w-full h-full flex flex-col relative overflow-hidden" style={{ backgroundImage: 'radial-gradient(circle at 50% 0%, #111116 0%, #050508 100%)' }}>
                    
                    {/* Filtros Visuais SVG */}
                    <svg className="hidden">
                        <defs>
                            <filter id="rough-ink"><feTurbulence type="fractalNoise" baseFrequency="0.1" numOctaves="3" result="noise" /><feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" /></filter>
                            <filter id="watercolor-bleed"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" /><feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G" /><feGaussianBlur stdDeviation="2" /></filter>
                        </defs>
                    </svg>

                    {/* HUD SUPERIOR (As Métricas) */}
                    <header className="w-full pt-8 pb-4 px-4 flex justify-between items-start z-40 relative border-b border-[#1A1A1E]"
                            style={{ background: 'linear-gradient(to bottom, #0A0A0E 60%, transparent)' }}>
                        <TopMetric value={Math.round(metrics.sintonia)} color="#C17F3A" label="Sintonia" 
                            icon={<path d="M12 22c5-4 8-9 8-13A8 8 0 004 9c0 4 3 9 8 13zM12 14a3 3 0 100-6 3 3 0 000 6z" />} />
                        <TopMetric value={Math.round(metrics.tensao)} color="#8B1A1A" label="Tensão" 
                            icon={<g><path d="M2 12c0 0 4-7 10-7s10 7 10 7-4 7-10 7-10-7-10-7z" /><circle cx="12" cy="12" r="3" fill="#8B1A1A" fillOpacity="0.5" /><line x1="12" y1="3" x2="12" y2="5" /><line x1="12" y1="19" x2="12" y2="21" /></g>} />
                        <TopMetric value={Math.round(metrics.creditos)} color="#00C8D4" label="Créditos" 
                            icon={<g><polygon points="12 2 22 7 22 17 12 22 2 17 2 7" /><polyline points="2 7 12 12 22 7" /><line x1="12" y1="22" x2="12" y2="12" /></g>} />
                        <TopMetric value={Math.round(metrics.estrutura)} color="#2D4A2D" label="Estrutura" 
                            icon={<g><rect x="4" y="4" width="16" height="4" /><rect x="6" y="8" width="4" height="12" /><rect x="14" y="8" width="4" height="12" /><line x1="2" y1="20" x2="22" y2="20" /></g>} />
                    </header>

                    {/* ÁREA DE JOGO (Simulação do Swipe Card) */}
                    <main className="flex-1 w-full flex flex-col items-center justify-center p-6 relative z-30">
                        {/* Frame do Card (Placeholder para a arte gerada) */}
                        <div key={turn} className="w-full aspect-[3/4] bg-[#0A0A08] border border-[#1A1A1E] rounded-sm relative flex flex-col items-center justify-end p-6 card-enter overflow-hidden"
                             style={{ filter: 'url(#rough-ink)', boxShadow: '0 20px 40px -10px rgba(0,0,0,0.8)' }}>
                            
                            {/* Dummy Imagem Expressionista */}
                            <div className="absolute inset-0 opacity-30" 
                                 style={{ background: 'radial-gradient(circle at 30% 70%, #0D2A0D 0%, transparent 60%), radial-gradient(circle at 80% 20%, #8B1A1A 0%, transparent 50%)', filter: 'url(#watercolor-bleed)' }}></div>
                            
                            {/* Retrato Silhueta Dummy */}
                            <div className="absolute bottom-0 w-3/4 h-2/3 bg-black rounded-t-full opacity-80 blur-sm"></div>

                            {/* Textos do Card */}
                            <div className="relative z-10 w-full text-center mt-auto bg-gradient-to-t from-black via-black/80 to-transparent pt-12 pb-4">
                                <h2 className="font-serif text-xl tracking-wider text-[#E8E4F0] mb-2 uppercase">Agente da Lima&Souza</h2>
                                <p className="font-sans text-sm text-gray-400 leading-snug px-2">
                                    "Identificamos anomalias de fluxo térmico no Setor LK-7. Solicito autorização para batida preventiva."
                                </p>
                            </div>
                        </div>

                        {/* Controles Simulados (Swipe Left / Right) */}
                        <div className="w-full flex justify-between mt-8 px-4 relative z-40">
                            <button onClick={simulateSwipe} className="w-14 h-14 rounded-full border-2 border-[#8B1A1A] flex items-center justify-center text-[#8B1A1A] hover:bg-[#8B1A1A]/20 transition-colors">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </button>
                            <button onClick={simulateSwipe} className="w-14 h-14 rounded-full border-2 border-[#2D4A2D] flex items-center justify-center text-[#2D4A2D] hover:bg-[#2D4A2D]/20 transition-colors">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </button>
                        </div>
                    </main>

                    {/* Decorativo: ID do Terminal */}
                    <div className="absolute bottom-2 left-0 w-full text-center opacity-30 z-10 pointer-events-none">
                        <span className="font-mono text-[10px] tracking-widest text-[#00C8D4]">TERMINAL_OPAL_v4.2 // TURNO: {turn}</span>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
